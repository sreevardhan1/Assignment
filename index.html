<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Cards</title>
  <link rel="stylesheet" href="index.css">
  <!-- Font Awesome for Stars & Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="card-container">
    
    <!-- Card 1 -->
    <div class="card">
      <div class="card-header">
        <img src="./assets/gupta.png" alt="Sreevardhan">
      </div>
      <div class="card-body">
        <h2>Sreevardhan</h2>
        <h4>Web Developer</h4>
        <div class="stars">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
        </div>
        <div class="buttons">
          <button class="btn">About Me</button>
          <button class="btn">Hire Me</button>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="card-header">
        <img src="./assets/jayanth.png" alt="Jayanth">
      </div>
      <div class="card-body">
        <h2>Jayanth</h2>
        <h4>App Developer</h4>
        <div class="stars">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
        </div>
        <div class="buttons">
          <button class="btn">About Me</button>
          <button class="btn">Hire Me</button>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card">
      <div class="card-header">
        <img src="./assets/pawan.png" alt="Pavan">
      </div>
      <div class="card-body">
        <h2>Pavan</h2>
        <h4>Photographer</h4>
        <div class="stars">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
        </div>
        <div class="buttons">
          <button class="btn">About Me</button>
          <button class="btn">Hire Me</button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
